spring:
  application:
    name: htkhcn

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/htkhcn}
    username: ${DB_USERNAME:htkhcn}
    password: ${DB_PASSWORD:htkhcn}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V1-V14 da duoc ap dung thu cong (sua loi truc tiep) truoc khi Flyway duoc
    # dung lan dau tren DB nay - baseline tai 14 de Flyway khong chay lai/xung
    # dot voi cac object da ton tai. Cac migration MOI (V15+) sau nay se do
    # Flyway tu chay binh thuong nhu thuong le.
    baseline-version: 14
    baseline-description: "Da ap dung thu cong V1-V14 truoc khi tich hop Flyway"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

app:
  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@dhkg.edu.vn}
    default-password: ${ADMIN_DEFAULT_PASSWORD:Admin@123}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_key_at_least_32_bytes_long_1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    # Wildcard cong: Vite dev server tu doi cong neu 5173 dang bi chiem.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:*}
  mou:
    canh-bao-mac-dinh-ngay: 90,60,30,14,7,1,0
  scheduling:
    # Local dev: dung Spring @Scheduled thay pg_cron (xem SPEC muc 10 - phuong an du phong).
    quet-mou-cron: "0 0 6 * * *"
    dashboard-refresh-ms: 900000
    email-thong-bao-fixed-rate-ms: 300000
    # Crawl phap luat moi (tinh nang bo sung ngoai SPEC ban dau) - chay som,
    # sau gio hanh chinh de khong anh huong tai nguyen server ban ngay.
    crawl-phap-luat-cron: "0 30 5 * * *"
    # Dong bo CongVan (tinh nang bo sung) - gio khac voi crawl phap luat de
    # giai deu tai, khong lien quan gi crawl phap luat.
    congvan-dong-bo-cron: "0 0 6 * * *"
    # Cong van den - gio lech voi dong bo Van ban noi bo o tren de giai deu tai.
    congvan-den-dong-bo-cron: "0 15 6 * * *"
  crawl:
    # vbpl.vn chan bot o tang WAF (403), TAT mac dinh - xem CrawlPhapLuatService.
    vbpl-portal-enabled: ${CRAWL_VBPL_PORTAL_ENABLED:false}
  congvan:
    # API "Van ban noi bo don vi" cua he thong CongVan truong DHKG (qlvb.vnkgu.edu.vn) -
    # xem API_VANBANNOIBO.md. Key cap boi Admin CongVan cho dung 1 don vi (P.HTKHCN).
    base-url: ${CONGVAN_BASE_URL:https://qlvb.vnkgu.edu.vn/api/v1/vanbannoibo}
    # API "Cong van den theo don vi" - xem API_VANBAN_DEN.md. Dung chung
    # CONGVAN_API_KEY o tren (cung 1 key cap cho don vi, khac API con lai).
    den-base-url: ${CONGVAN_DEN_BASE_URL:https://qlvb.vnkgu.edu.vn/api/v1/vanban-den}
    api-key: ${CONGVAN_API_KEY:}
  mail:
    from: ${MAIL_FROM:htkhcn@dhkg.edu.vn}
    enabled: ${MAIL_ENABLED:false}
  upload:
    dir: ${UPLOAD_DIR:./data/uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    vn.edu.dhkg.htkhcn: DEBUG
