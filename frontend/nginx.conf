# Serve React (Vite) SPA build + reverse-proxy /api sang container backend
# cung docker network (ten service "backend" dat trong docker-compose.yml).
# Cung 1 origin voi frontend nen khong can cau hinh CORS o backend cho
# production - trinh duyet goi /api/... la cung domain/port voi trang web.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
